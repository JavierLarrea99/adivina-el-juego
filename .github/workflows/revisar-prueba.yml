name: Probar filtro de capturas

# Revisa una muestra de juegos al azar y sube hojas de contacto con las capturas descartadas
# a la rama "revision", para comprobar a ojo que el filtro no quita capturas buenas.

on:
  workflow_dispatch:
    inputs:
      n:
        description: "Cuántos juegos revisar"
        default: "250"
      semilla:
        description: "Semilla para elegir los juegos"
        default: "7"

permissions:
  contents: write

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Instalar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r scripts/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: clip-vit-b-32-laion2b-v1
      - run: python scripts/revisar.py muestra data/games.json --n ${{ inputs.n }} --semilla ${{ inputs.semilla }} --salida revision
      - name: Subir a la rama revision
        run: |
          cd revision
          git init -q -b revision
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Revisión de capturas (${{ inputs.n }} juegos, semilla ${{ inputs.semilla }})"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" revision
